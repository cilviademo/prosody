# Fast checks on every push. The release workflow re-runs these on Windows
# before it builds anything, so a green tag build is not a coincidence.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff

      - name: Lint
        run: ruff check prosody_core tests

      - name: Test
        run: pytest -q -m "not corpus and not render"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Check types and build the UI
        working-directory: apps/desktop
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
