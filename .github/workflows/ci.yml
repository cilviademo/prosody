# Fast checks on every push. The release workflow re-runs these on Windows
# before it builds anything, so a green tag build is not a coincidence.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff

      # Lockfile drift (HARDENING P2.7) is already asserted by
      # tests/unit/test_boundaries.py — test_every_imported_package_is_a_required_dependency
      # and test_pinned_requirements_cover_the_required_dependencies — which is
      # the check that caught the mido bug. It runs in the Test step below, so
      # there is no separate CI step duplicating it.
      - name: Lint
        run: ruff check prosody_core tests

      - name: Test
        run: pytest -q -m "not corpus and not render"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Check types and build the UI
        working-directory: apps/desktop
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      # The Windows-only Rust — WebView2 detection, CREATE_NO_WINDOW, the
      # registry reads — is invisible to a Linux build: cargo skips every
      # #[cfg(windows)] block. Type-checking against the Windows target here
      # catches a broken one in a minute instead of twenty into a release job.
      - name: Set up Rust for the Windows target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-wincheck-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wincheck-

      # tauri-winres compiles the .rc (icon, version block) with llvm-rc when
      # the host is not Windows; ubuntu-latest ships LLVM without the
      # unversioned llvm-rc on PATH, and the build script panics without it.
      - name: Install llvm-rc for the Windows resource compile
        run: sudo apt-get update -q && sudo apt-get install -y -q llvm

      - name: Type-check the Windows-only Rust
        working-directory: apps/desktop/src-tauri
        run: cargo check --target x86_64-pc-windows-msvc
