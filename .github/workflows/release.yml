# Builds the Prosody Windows release.
#
# Windows binaries need Windows, so this is the path that produces the ZIP and
# the installer regardless of what the developer's machine runs. Push a tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The artefacts appear on the Releases page a few minutes later. The job takes
# no secrets beyond the automatic GITHUB_TOKEN; if it ever needs one, that is
# a bug in the build, not a missing setting.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (defaults to tauri.conf.json)"
        required: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run the test suite
        run: |
          pip install -e ".[dev]"
          pytest -q -m "not corpus and not render"

      - name: Build the core
        run: python -m PyInstaller prosody-core.spec --noconfirm --clean

      # A core that builds but cannot answer is the failure mode that reaches
      # users, so prove the handshake here rather than on their machine.
      - name: Verify the core answers ping
        shell: pwsh
        run: |
          $reply = '{"id":1,"method":"ping"}' | & ".\dist\prosody-core\prosody-core.exe"
          Write-Host $reply
          if ($reply -notmatch '"ok":\s*true') { throw "core did not answer ping" }

      - name: Stage the core as a Tauri resource
        shell: pwsh
        run: |
          $dest = "apps\desktop\src-tauri\resources\prosody-core"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item "dist\prosody-core\*" $dest -Recurse -Force

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check types
        working-directory: apps/desktop
        run: npx tsc --noEmit

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build the app and installer
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Assemble the portable ZIP
        shell: pwsh
        run: .\scripts\make-portable.ps1

      - name: Collect the installer
        shell: pwsh
        run: |
          $nsis = "apps\desktop\src-tauri\target\release\bundle\nsis"
          if (Test-Path $nsis) {
            Get-ChildItem $nsis -Filter *.exe | ForEach-Object {
              Copy-Item $_.FullName "release\$($_.Name)" -Force
              Write-Host "installer: $($_.Name)"
            }
          } else {
            Write-Warning "no NSIS output at $nsis"
          }
          Get-ChildItem release -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            ForEach-Object {
              "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name
            } | Set-Content "release\SHA256SUMS.txt" -Encoding UTF8
          Get-Content "release\SHA256SUMS.txt"

      # A smoke test of the thing users actually download: extract the ZIP
      # somewhere else and confirm the bundled core still starts from it.
      - name: Smoke-test the extracted ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem release -Filter *.zip | Select-Object -First 1
          $test = "$env:RUNNER_TEMP\prosody-zip-test"
          Expand-Archive $zip.FullName -DestinationPath $test -Force
          $exe = Join-Path $test "Prosody\Prosody.exe"
          if (-not (Test-Path $exe)) { throw "Prosody.exe missing from the ZIP" }
          $core = Join-Path $test "Prosody\resources\prosody-core\prosody-core.exe"
          if (-not (Test-Path $core)) { throw "the core is missing from the ZIP" }
          $reply = '{"id":1,"method":"ping"}' | & $core
          Write-Host "core in ZIP: $reply"
          if ($reply -notmatch '"ok":\s*true') { throw "the core in the ZIP does not run" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prosody-windows
          path: release/*
          if-no-files-found: error

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
