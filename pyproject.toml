[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prosody-core"
version = "0.1.0"
description = "Prosody core: parses FL Studio projects, plans arrangements and writes derivative .flp files."
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
  "pyflp>=2.2.1",      # only .flp parser with a public Python API; isolated behind parse/adapter.py
  "pydantic>=2.0",     # the data contract; v2 validators enforce permission levels structurally
  "mido>=1.3",         # per-role .mid export, which every build performs
  "typer>=0.12",       # CLI arg parsing without hand-rolled argparse
  "rich>=13.0",        # console tables; also Typer's renderer
]

[project.optional-dependencies]
# Not imported by anything today. Listed so the intent is recorded and so the
# PyInstaller spec does not ship ~50 MB of unused DLLs in every release.
preview = [
  "numpy>=1.26",       # stem stitching maths (preview/stitch.py, not yet built)
  "soundfile>=0.12",   # WAV read/write for previews and stem null tests
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
prosody-core = "prosody_core.server:main"
flpf = "prosody_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["prosody_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = [
  "corpus: needs a populated corpus/ of real .flp files (local only)",
  "render: needs FL Studio and FLPF_RENDER=1 (studio PC only, never CI)",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "C4", "SIM", "RUF"]
ignore = [
  "B008",    # typer.Option/Argument in defaults is the Typer idiom
  "E501",    # line length is handled by the formatter
  "RUF012",  # mutable class attrs; pydantic models are frozen anyway
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
