[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flp-finisher"
version = "0.1.0"
description = "Local-first CLI that inspects, analyses and (later) arranges FL Studio projects."
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
  "pyflp>=2.2.1",      # only .flp parser with a public Python API; isolated behind parse/adapter.py
  "pydantic>=2.0",     # the data contract; v2 validators enforce permission levels structurally
  "typer>=0.12",       # CLI arg parsing without hand-rolled argparse
  "rich>=13.0",        # console tables; also Typer's renderer
]

[project.optional-dependencies]
# Deferred to their phases; listed so the intent is recorded, not installed yet.
extract = [
  "mido>=1.3",         # per-role .mid writing (Phase 2)
  "numpy>=1.26",       # stem stitching maths (Phase 4 preview)
  "soundfile>=0.12",   # WAV read/write for previews and null tests (Phase 4)
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
flpf = "flpfinisher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["flpfinisher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = [
  "corpus: needs a populated corpus/ of real .flp files (local only)",
  "render: needs FL Studio and FLPF_RENDER=1 (studio PC only, never CI)",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "C4", "SIM", "RUF"]
ignore = [
  "B008",    # typer.Option/Argument in defaults is the Typer idiom
  "E501",    # line length is handled by the formatter
  "RUF012",  # mutable class attrs; pydantic models are frozen anyway
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
